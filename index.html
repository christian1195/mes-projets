</style></head><body>
<div id="lock"><div class="card glass"><div class="fl">⚜️</div><h2>Mes projets</h2><p>Entre ton NIP pour ouvrir</p><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8" aria-label="NIP"><div id="err"></div><button class="btn tap" onclick="tryPin()">Ouvrir</button></div></div>

<script>
const SALT='mesprojets-real-2026:',HASH='1078d9e3f59bab37101ac44576dab55b1fa492152f2e07f9041708d2474e13cb',LK='mp_unlocked';let OK=localStorage.getItem(LK)===HASH;
const K={"Livres":"#7c8cff","Livres audio":"#c77dff","YouTube":"#ff5d73","Maison":"#ffb454","Emploi":"#3ad1c6"},
S=["En attente de toi","Bloqué","En cours","À faire","Terminé"],
SC={"En attente de toi":"#ffb454","Bloqué":"#ff5d73","En cours":"#5ab0ff","À faire":"#a3abc8","Terminé":"#3ad19a"},
T=[["home","🏠","Accueil",null],["livres","📚","Livres",["Livres","Livres audio"]],["videos","🎬","Vidéos",["YouTube"]],["maison","🏡","Maison",["Maison"]],["job","💼","Job",["Emploi"]]];
let P=[],tab="home",Q="";
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function tryPin(){const v=pin.value;if(await sha(SALT+v)===HASH){localStorage.setItem(LK,HASH);OK=true;lock.style.display='none';pin.value='';err.textContent='';load()}else{err.textContent='NIP incorrect';pin.value='';pin.focus()}}
function relock(){localStorage.removeItem(LK);OK=false;P=[];app.innerHTML='';lock.style.display='flex';pin.focus()}
pin.addEventListener('keydown',x=>x.key=='Enter'&&tryPin());
if(OK)lock.style.display='none';
async function load(){if(!OK)return;try{const r=await fetch('projects.json?t='+Date.now(),{cache:'no-store'});const j=await r.json();P=j.projets;maj.textContent='Mis à jour le '+j.maj+' · Réal'}catch(x){maj.textContent='Hors ligne'}draw()}
const waiting=p=>p.statut=="En attente de toi"||/ton OK/.test(p.bloque_par||'');
function ring(p,s){const r=18,c=2*Math.PI*r,v=Math.max(0,Math.min(100,+p.progression||0));return `<svg class="ring" viewBox="0 0 44 44" style="--k:${K[p.categorie]||'#7c8cff'}"><circle class="bgc" cx="22" cy="22" r="${r}"/><circle class="fg" cx="22" cy="22" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}"/><text x="22" y="22">${v}%</text></svg>`}

function dvBtn(p){const v=p.derniere_version;if(v)return `<a class="btn big tap" href="${e(v.url)}" target="_blank" rel="noopener">📥 Dernière version<small>${e(v.label)} · ${e(v.date)}</small></a>`;return /Livre/.test(p.categorie)?`<span class="btn big off">📥 Dernière version<small>à venir</small></span>`:''}

function carousel(title,arr){return arr.length?`<div class="sec fade"><h2>${e(title)}</h2><span>${arr.length}</span></div><div class="row">${arr.map(p=>`<button class="bk tap" onclick="show(${p.id})"><div class="cov" style="--k:${K[p.categorie]}">${cov(p)}${isNew(p)}<div class="rg">${ring(p)}</div></div><div class="tt">${e(p.titre)}</div></button>`).join('')}</div>`:''}

arcb.classList.toggle("on",tab=="archives");const v=visible();let h='';if(tab=="archives"&&P.length){app.innerHTML=`<div class="sec fade"><h2>🗄️ Archives</h2><span>${v.length}</span></div>`+(v.length?`<div class="list">${v.map(p=>`<div role="button" tabindex="0" class="it glass tap fade arc" onclick="show(${p.id})" style="--k:${K[p.categorie]}">${ring(p)}<div class="tx">${pill(p.categorie)}<b>${e(p.titre)}</b><small class="r">Archivé le ${e(p.archive_date||p.maj||"")}${p.archive_raison?" · "+e(p.archive_raison):""}</small></div></div>`).join("")}</div>`:`<div class="empty fade"><div>🗄️</div><b>Aucune archive</b>Les projets archivés apparaîtront ici.</div>`);return}
if(!P.length){app.innerHTML=skel();return}if(!v.length){app.innerHTML=`<div class="empty fade"><div>🔍</div><b>Rien trouvé</b>${Q?'Essaie un autre mot.':'Aucun projet dans cet onglet pour l’instant.'}</div>`;return}
if(tab=="home"&&!Q){h+=stats(v);h+=recent(v)}if(tab=="home"){const w=v.filter(waiting);if(w.length)h+=`<section class="wait glass fade"><h2>⏳ Ce qui attend ta décision</h2><div class="sub">${w.length} projet${w.length>1?'s':''} attend${w.length>1?'ent':''} après toi</div>${w.map(p=>`<div class="wi" style="--k:${K[p.categorie]}"><div class="mini">${p.couverture?`<img src="${e(p.couverture)}" alt="">`:''}</div><div class="tx"><b>${e(p.titre)}${isNew(p)}</b><small>${e(p.prochaine_etape)}</small></div>${cpb(p)}${p.derniere_version?`<a class="btn tap" href="${e(p.derniere_version.url)}" target="_blank" rel="noopener">Ouvrir</a>`:`<button class="btn tap" onclick="show(${p.id})">Voir</button>`}</div>`).join('')}</section>`}
const bk=v.filter(p=>/Livre/.test(p.categorie)),ot=v.filter(p=>!/Livre/.test(p.categorie));
if(bk.length){for(const s of ["En attente de toi","En cours","Bloqué","À faire"])h+=carousel((tab=="home"?'Livres · ':'')+s,bk.filter(p=>p.statut==s));h+=carousel('Terminés',bk.filter(p=>p.statut=="Terminé"))}
if(ot.length){if(tab=="home")h+=`<div class="sec fade"><h2>Autres projets</h2><span>${ot.length}</span></div>`;h+=items([...ot].sort((a,b)=>S.indexOf(a.statut)-S.indexOf(b.statut)))}
app.innerHTML=h;counters()}
const TD=new Date('2026-10-22T12:00:00');function today(){const d=new Date();return d<TD?TD:d}
const age=p=>(today()-new Date((p.maj||'2026-10-22')+'T12:00:00'))/864e5;
const isNew=p=>age(p)<=3?'<span class="new">Nouveau</span>':'';

function arc(id){const p=P.find(x=>x.id==id),t=`${p.archive?"Désarchive":"Archive"} : ${p.titre}`;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copié ! Colle-le à Réal pour "+(p.archive?"désarchiver":"archiver")),()=>toast(t))}
function cp(id){const p=P.find(x=>x.id==id),t=`Projet : ${p.titre} — `;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copié ! Colle-le dans le chat avec Réal'),()=>toast('Copie impossible'))}
let tt;function toast(m){toast_el.textContent=m;toast_el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast_el.classList.remove('on'),1800)}const toast_el=document.getElementById('toast');
function skel(){const c=`<div class="row">${'<div class="sk" style="flex:none;width:136px;aspect-ratio:2/3"></div>'.repeat(3)}</div>`;return `<div class="sk" style="height:108px;margin:8px 14px"></div><div class="sk" style="height:22px;width:40%;margin:22px 18px 6px"></div>${c}<div class="sk" style="height:22px;width:50%;margin:16px 18px 6px"></div>${c}`}
function stats(v){const n=s=>v.filter(p=>p.statut==s).length,w=v.filter(waiting).length,avg=Math.round(v.reduce((a,p)=>a+(+p.progression||0),0)/v.length);
return `<section class="stats glass fade">${ring({progression:avg,categorie:'Livres'}).replace('class="ring"','class="ring big"')}<div class="st"><div><b data-n="${n('En cours')}">0</b><span>En cours</span></div><div><b data-n="${w}">0</b><span>Ta décision</span></div><div><b data-n="${n('Terminé')}">0</b><span>Terminés</span></div></div></section>`}
function recent(v){const r=[...v].sort((a,b)=>(b.maj||'').localeCompare(a.maj||'')||b.id-a.id).slice(0,8);return carousel('Activité récente',r)}
function counters(){const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n;if(rm){el.textContent=n;return}const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/700);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function tint(src){const i=new Image();i.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(i,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let r=0,g=0,b=0;for(let k=0;k<d.length;k+=4){r+=d[k];g+=d[k+1];b+=d[k+2]}const n=d.length/4;r=r/n|0;g=g/n|0;b=b/n|0;sheet.style.background=`radial-gradient(120% 60% at 50% 0%,rgba(${r},${g},${b},.55),transparent 70%),color-mix(in srgb,var(--bg2) 88%,transparent)`}catch(_){}};i.src=src}
document.addEventListener('click',x=>{if(x.target.closest('.tap')&&navigator.vibrate)try{navigator.vibrate(8)}catch(_){}},true);
(()=>{let y0=null,dy=0;sheet.addEventListener('touchstart',x=>{y0=sheet.scrollTop<=0?x.touches[0].clientY:null;dy=0},{passive:true});
sheet.addEventListener('touchmove',x=>{if(y0==null)return;dy=x.touches[0].clientY-y0;if(dy>0){sheet.style.transition='none';sheet.style.transform=`translateY(${dy}px)`}},{passive:true});
sheet.addEventListener('touchend',()=>{if(y0==null)return;sheet.style.transition='';sheet.style.transform='';if(dy>110)hide();y0=null});
let p0=null,pd=0;addEventListener('touchstart',x=>{p0=(scrollY<=0&&!sheet.classList.contains('on')&&tab=='home'&&OK)?x.touches[0].clientY:null;pd=0},{passive:true});
addEventListener('touchmove',x=>{if(p0==null)return;pd=Math.min(120,x.touches[0].clientY-p0);if(pd>0)ptr.style.transform=`translate(-50%,${pd-60}px) rotate(${pd*3}deg)`},{passive:true});
addEventListener('touchend',async()=>{if(p0==null)return;p0=null;if(pd>80){ptr.classList.add('spin');ptr.style.transform='translate(-50%,10px)';await load();toast('À jour');}ptr.classList.remove('spin');ptr.style.transform=''})})();
function go(t){tab=t;draw();scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
q.addEventListener('input',()=>{Q=q.value;draw()});
function show(id){const p=P.find(x=>x.id==id);if(!p)return;sheet.innerHTML=`<div class="grab"></div>${p.couverture||/Livre/.test(p.categorie)?`<div class="sh-cov" style="--k:${K[p.categorie]}">${cov(p)}</div>`:''}<div class="meta">${ring(p)}<div>${pill(p.statut)}<div style="color:var(--mu);font-size:13px;margin-top:4px">${e(p.categorie)} · MAJ ${e(p.maj)}</div></div></div><div style="display:flex;gap:10px;align-items:center"><h3 style="flex:1">${e(p.titre)}${isNew(p)}</h3>${cpb(p)}</div>${dvBtn(p)}<div class="kv glass"><b>Prochaine étape</b>${e(p.prochaine_etape)}</div><div class="kv glass"><b>Bloqué par</b>${e(p.bloque_par)}</div>${(p.liens||[]).map(l=>`<a class="lk glass tap" href="${e(l.url)}" target="_blank" rel="noopener">🔗 ${e(l.titre)}</a>`).join('')}${p.archive?`<div class="kv glass"><b>Archivé</b>${e(p.archive_date||"")}${p.archive_raison?" · "+e(p.archive_raison):""}</div>`:""}<button class="btn ghost tap" onclick="arc(${p.id})">🗄️ ${p.archive?"Désarchiver":"Archiver"}</button><button class="close tap" onclick="hide()">Fermer</button>`;sheet.scrollTop=0;sheet.style.background='';if(p.couverture)tint(p.couverture);scrim.classList.add('on');sheet.classList.add('on')}
function hide(){scrim.classList.remove('on');sheet.classList.remove('on')}
addEventListener('keydown',x=>x.key=='Escape'&&hide());
document.addEventListener('visibilitychange',()=>document.visibilityState=='visible'&&load());
draw();load();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>

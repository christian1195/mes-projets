const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(_){}};h('play',()=>AU.play());h('pause',()=>AU.pause());h('seekbackward',()=>skip(-30));h('seekforward',()=>skip(30));h('seekto',d=>{AU.currentTime=d.seekTime;savePos()});
h('previoustrack',AP.audio.length>1?()=>AC>0&&startP(AP.id,AC-1,0):null);h('nexttrack',AP.audio.length>1?()=>AC<AP.audio.length-1&&startP(AP.id,AC+1,0):null)}

let M=[];const MK='mp_montre_vu',MTY={comparatif:['📊','#7c8cff'],diagramme:['🧭','#3ad1c6'],recherche:['🔬','#c77dff'],autre:['✨','#ffb454']};

function montreView(){const lim=Date.now()-14*864e5,rec=M.filter(x=>new Date(x.date+'T23:59')>=lim),old=M.filter(x=>new Date(x.date+'T23:59')<lim);let h=`<div class="sec fade"><h2>👀 Réal te montre</h2><span>${M.length}</span></div>`;if(!M.length)h+='<div class="empty fade"><div>👀</div><b>Rien encore</b><br>Réal va publier ses trouvailles ici.</div>';h+=`<div class="list">${rec.map(x=>mCard(x)).join('')}</div>`;if(!rec.length&&M.length)h+='<div class="empty">Rien de nouveau ces 14 derniers jours.</div>';if(old.length)h+=`<details class="old glass"><summary>🗂️ Plus vieux (${old.length}) ▾</summary><div class="list" style="padding:0 10px 10px">${old.map(x=>mCard(x,1)).join('')}</div></details>`;app.innerHTML=h}
